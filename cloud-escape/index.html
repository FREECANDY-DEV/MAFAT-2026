<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #0d0d0d; 
            color: #00ff41; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: rgba(10, 20, 10, 0.3); 
            padding: 25px;
            border: 1px solid #00ff41;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }
        h1 {
            color: #00ff41; 
            font-size: 1.8em; 
            margin-bottom: 1em;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hint {
            font-size: 1.1em;
            line-height: 1.6;
            color: #00ff41; 
            margin-top: 15px;
            padding-left: 10px;
            border-left: 2px dashed #00dd30; 
            white-space: pre-wrap; 
        }
        .hint::before {
            content: "> "; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Site</h1>
        <p class="hint">
I worked hard on this site, but I had a lot of fun doing it!

I made sure not to include any secret information here—pretty sure I deleted it all.

Here’s a picture of me having so much fun:
<img src="junior_developer.png" alt="This is me"
     style="
        display: block;
        margin: 20px auto;
        max-width: 100%;
        height: auto;
        border: 2px solid #00ff41;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
     ">>
        </p>
    </div>
</body>
</html>
