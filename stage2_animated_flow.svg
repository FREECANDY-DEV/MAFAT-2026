<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <!-- Glowing filter for neon cyan effect -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Glowing filter for neon orange effect -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00C7B7" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
    </marker>
  </defs>

  <style>
    text {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #E6EDF3;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .subtext {
      font-size: 10px;
      font-weight: bold;
      fill: #8B949E;
    }

    /* Background panel styling */
    .bg-panel {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
      rx: 12;
    }

    /* Box nodes */
    .node-box {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 2;
      rx: 8;
    }

    .node-cyan {
      stroke: #00C7B7;
    }

    .node-orange {
      stroke: #FF9900;
    }

    .node-blue {
      stroke: #3B82F6;
    }

    /* Flow line animations - marching dashes */
    @keyframes flow-down {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes flow-audit {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulse-box {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px rgba(0, 199, 183, 0.4)); }
      50% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(0, 199, 183, 0.8)); }
    }

    @keyframes pulse-orange {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px rgba(255, 153, 0, 0.4)); }
      50% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(255, 153, 0, 0.8)); }
    }

    .animated-path-cyan {
      fill: none;
      stroke: #00C7B7;
      stroke-width: 2.2;
      stroke-dasharray: 8 4;
      animation: flow-down 1.2s linear infinite;
    }

    .animated-path-blue {
      fill: none;
      stroke: #3B82F6;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      animation: flow-down 1.5s linear infinite;
    }

    .animated-path-orange {
      fill: none;
      stroke: #FF9900;
      stroke-width: 2;
      stroke-dasharray: 5 5;
      animation: flow-audit 1.8s linear infinite;
    }

    .pulse-target {
      animation: pulse-box 3s ease-in-out infinite;
    }

    .pulse-log {
      animation: pulse-orange 3s ease-in-out infinite;
    }

    /* Label badges on lines */
    .badge-bg {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 1;
      rx: 4;
    }
    .badge-text {
      font-size: 10px;
      fill: #FF9900;
      font-weight: 700;
    }
  </style>

  <!-- Outer background container -->
  <rect class="bg-panel" x="10" y="10" width="680" height="440" />

  <!-- TITLE -->
  <text x="350" y="38" style="font-size: 14px; fill: #58A6FF;">⚡ STAGE 2 ATTACK &amp; AUDIT TRAFFIC FLOW (ANIMATED RECON MAP) ⚡</text>

  <!-- CONNECTING FLOW LINES (drawn behind boxes) -->

  <!-- Participant STS -> code_exec (vertical drop) -->
  <path class="animated-path-cyan" marker-end="url(#arrow-cyan)" d="M 220 94 L 220 126" />

  <!-- Participant STS -> log bucket READ (long vertical down-right curve) -->
  <path class="animated-path-orange" marker-end="url(#arrow-orange)" d="M 170 94 L 170 340 Q 170 380 230 380 L 268 380" />

  <!-- code_exec -> Lambda VPC -->
  <path class="animated-path-cyan" marker-end="url(#arrow-cyan)" d="M 220 174 L 220 206" />

  <!-- Lambda VPC -> path-style S3 -->
  <path class="animated-path-cyan" marker-end="url(#arrow-cyan)" d="M 220 254 L 220 286" />

  <!-- path-style S3 -> user bucket (horizontal arrow right) -->
  <path class="animated-path-cyan" marker-end="url(#arrow-cyan)" d="M 300 310 L 416 310" />

  <!-- path-style S3 -> log bucket READ (failed/denied access log path) -->
  <path class="animated-path-blue" marker-end="url(#arrow-blue)" d="M 220 332 L 220 365 Q 220 380 268 380" />

  <!-- CloudFront -> user bucket -->
  <path class="animated-path-cyan" marker-end="url(#arrow-cyan)" d="M 500 254 L 500 286" />

  <!-- user bucket -.-> CloudTrail -> log bucket -->
  <path class="animated-path-orange" marker-end="url(#arrow-orange)" d="M 500 332 L 500 380 L 442 380" />

  <!-- AUDIT TRAFFIC LABEL BADGE -->
  <rect class="badge-bg" x="460" y="348" width="80" height="20" />
  <text class="badge-text" x="500" y="359">CloudTrail</text>

  <!-- NODES (BOXES) -->

  <!-- 1. Participant STS -->
  <g transform="translate(140, 50)">
    <rect class="node-box node-cyan" width="160" height="44" />
    <text x="80" y="22">Participant STS</text>
  </g>

  <!-- 2. code_exec SigV4 -->
  <g transform="translate(140, 130)">
    <rect class="node-box node-cyan" width="160" height="44" />
    <text x="80" y="22">code_exec SigV4</text>
  </g>

  <!-- 3. Lambda VPC -->
  <g transform="translate(140, 210)">
    <rect class="node-box node-cyan" width="160" height="44" />
    <text x="80" y="22">Lambda VPC</text>
  </g>

  <!-- 4. path-style S3 -->
  <g transform="translate(140, 288)">
    <rect class="node-box node-cyan pulse-target" width="160" height="44" />
    <text x="80" y="18">path-style S3</text>
    <text class="subtext" x="80" y="33">UNSIGNED via VPCe</text>
  </g>

  <!-- 5. CloudFront -->
  <g transform="translate(420, 210)">
    <rect class="node-box node-blue" width="160" height="44" />
    <text x="80" y="22">CloudFront</text>
  </g>

  <!-- 6. user bucket -->
  <g transform="translate(420, 288)">
    <rect class="node-box node-cyan pulse-target" width="160" height="44" />
    <text x="80" y="18">user bucket</text>
    <text class="subtext" x="80" y="33">userd8a... / flag.txt</text>
  </g>

  <!-- 7. log bucket READ -->
  <g transform="translate(270, 356)">
    <rect class="node-box node-orange pulse-log" width="170" height="48" />
    <text x="85" y="19" style="fill: #FF9900;">log bucket READ</text>
    <text class="subtext" x="85" y="35">s3://logd8a.../userd8a...</text>
  </g>

  <!-- FOOTER LEGEND -->
  <g transform="translate(40, 422)">
    <!-- Cyan line -->
    <line x1="0" y1="8" x2="28" y2="8" class="animated-path-cyan" />
    <text x="85" y="9" style="font-size: 11px; fill: #8B949E;">Data / Probes</text>
    <!-- Orange line -->
    <line x1="160" y1="8" x2="188" y2="8" class="animated-path-orange" />
    <text x="260" y="9" style="font-size: 11px; fill: #8B949E;">CloudTrail Audit Flow</text>
    <!-- Blue line -->
    <line x1="340" y1="8" x2="368" y2="8" class="animated-path-blue" />
    <text x="445" y="9" style="font-size: 11px; fill: #8B949E;">CloudFront / Deny</text>
  </g>
</svg>
